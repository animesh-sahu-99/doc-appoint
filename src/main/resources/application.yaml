server:
  port: 9091
spring:
  application:
    name: doc-appointment

  datasource:
    url: jdbc:postgresql://localhost:5432/doc_appointment_db
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: false

# JWT Configuration
jwt:
  secret: doc-appointment-super-secret-key-change-in-production-2024
  expiration: 86400000  # 24 hours in milliseconds

# Login brute-force rate limiting (per client IP, in-memory)
ratelimit:
  login:
    max-attempts: 5          # failed attempts before an IP is blocked
    block-minutes: 15        # how long a blocked IP must wait
    trust-forwarded-for: false  # only enable behind a trusted reverse proxy

# File Storage Configuration
file:
  upload-dir: uploads
  encryption:
    secret: my-secret-encryption-key-32bytes! # 32 chars for AES-256

# Spring Multipart Configuration
spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 10MB
