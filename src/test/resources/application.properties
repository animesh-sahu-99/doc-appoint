# Test-only configuration.
#
# The project previously had no src/test/resources at all, so every test context inherited
# application.yaml - including its Postgres URL and its production schema strategy.

# ---------------------------------------------------------------------------------------------
# Database: in-memory H2 in PostgreSQL compatibility mode.
#
# This also fixes a pre-existing failure: DocAppointmentApplicationTests is a @SpringBootTest and
# was inheriting the Postgres URL, so the context could only load on a machine that happened to
# have a local Postgres running. It now boots anywhere.
# ---------------------------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:doc_appointment_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate builds the schema for tests. Production uses Flyway plus ddl-auto=validate; the
# migrations are Postgres-specific DDL, so replaying them against H2 would test the dialect rather
# than the code. Trade-off worth naming: the migrations themselves are exercised against Postgres
# only, not by this suite.
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# Match production so a test cannot pass by relying on an open session that production does not have.
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------------------------
# Secrets: real test values, because startup now refuses the committed defaults outside `dev`.
# These are throwaway strings used only by the test JVM.
# ---------------------------------------------------------------------------------------------
jwt.secret=test-only-jwt-signing-secret-not-used-anywhere-else-0123456789
file.encryption.secret=test-only-file-encryption-key-32b!

# ---------------------------------------------------------------------------------------------
# Background work off by default: the outbox worker polls every second, and a test that is not
# about push should not race a scheduler. Tests that exercise it drive the methods directly.
# ---------------------------------------------------------------------------------------------
push.outbox.enabled=false
fcm.fail-on-invalid-credentials=false

logging.level.org.hibernate.SQL=warn
